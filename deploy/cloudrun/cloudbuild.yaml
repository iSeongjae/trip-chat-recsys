# gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml --substitutions _REPO=asia-northeast1-docker.pkg.dev/<프로젝트>/wsid,_TAG=v1
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/cloudrun/Dockerfile.api', '-t', '${_REPO}/api:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/cloudrun/Dockerfile.web', '-t', '${_REPO}/web:${_TAG}', '.']
images: ['${_REPO}/api:${_TAG}', '${_REPO}/web:${_TAG}']
substitutions:
  _REPO: ''
  _TAG: 'latest'
options:
  machineType: E2_HIGHCPU_8
